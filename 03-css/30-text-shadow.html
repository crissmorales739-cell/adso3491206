<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30-Text Shadow</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        section {
            p.txt {
                text-align: center;
                font-size: 3.6rem;

                &.txt1{
                    text-shadow: 0px 0px 16px white;
                }
                &.txt2{
                    text-shadow: -8px -8px 8px white;
                }
                &.txt3 {
                    font-weight: 900;
                    letter-spacing: 0.4rem;
                    text-shadow:     0 1px 0 #c9cfce,
                                     0 2px 0 #bcc2c2,
                                     0 3px 0 #afb6b6,
                                     0 4px 0 #a4adac,
                                     0 5px 0 #9fa8a7,
                                     0 6px 0 #99a3a2,
                                     0 7px 0 #97a1a0,
                                     0 8px 0 #949e9d,
                    
                                    0 0     5px #0000000d,
                                    0 1px   3px #00000033,
                                    0 3px   5px #00000033,
                                    0 5px  10px #00000033,
                                    0 10px 10px #00000033,
                                    0 20px 20px #0000004d;
                }
                &.txt4 {
                    color: #fff;
                    letter-spacing: 0.6rem;
                    text-shadow: -5px 0 0 #fcdd09,
                                 -10px 0 0 #078930;
                }
            }
        }
    </style>
</head>
<body class="css">
    <nav class="back">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path></svg>
        </a>
    </nav>
    <main>
        <header class="mainmenu internal">
            <h1>30-Text Shadow</h1>
            <img src="../src/imgs/logo-css.png" alt="Css">
            <h3>Property that adds shadow effects directly to text content, taking values for offset, blur radius, and color.</h3>
        </header>
        <section>
            <h2 class="subtitle">Examples:</h2>
            <p class="txt txt1">ADSO</p>
            <p class="txt txt2">C.P.I.C</p>
            <p class="txt txt3">SENA</p>
            <p class="txt txt4">Caldas</p>
        </section>
    </main>
</body>
</html>
