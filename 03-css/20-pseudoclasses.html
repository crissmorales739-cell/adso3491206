        <style>
        /* :link, :hover, :active, :visited */
         
            a:link,
            a:visited {
                background-color: #fff9;
                color: #0009;
                padding: 0.4rem 0.8rem;
            }
            a:hover {
                background-color: #663399;
                color: #fff9;
            }
            a:active {
                background-color: #dc143c;
                color: #fff9;
            }
            a:first-child {
                opacity: .5;
                pointer-events: none;
            }
        /* :focus, :blur */
        input {
            padding: 0.4rem;
            margin-top: 0.4rem;
            &:focus {
                background-color: #663399;
                color: #fff9;
            }
        }
        /* :first-line, :first-letter */
        p.paragraph {
            &::first-line {
                background-color: #663399;
            }
            &::first-letter {
                font-size: 4rem;
            }
        }
    </style>
</head>
