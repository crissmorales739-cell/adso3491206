
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>00-template</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        div#runner {
            background: url(imgs/anim-sprite.png) no-repeat;
            margin: 2rem auto;
            height: 256px;
            width: 256px;
            &.sp1 {background-position: calc(-256px * 0) 0;}
            &.sp2 {background-position: calc(-256px * 1) 0;}
            &.sp3 {background-position: calc(-256px * 2) 0;}
            &.sp4 {background-position: calc(-256px * 3) 0;}
            &.sp5 {background-position: calc(-256px * 4) 0;}
            &.sp6 {background-position: calc(-256px * 5) 0;}
        }
         div#dino {
            background: url(imgs/dino-sprite.png) no-repeat;
            margin: 2rem auto;
            height: 128px;
            width: 128px;
             &.sp1 {background-position: calc(-128px * 0) 0;}
             &.sp2 {background-position: calc(-128px * 1) 0;}
        }
    </style>
</head> 
<body class="css">
    <nav class ="back">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path></svg>
        </a>
    </nav>
    <main> 
        <header class="mainmenu internal">
            <h1>00-template</h1>
            <img src="../src/imgs/logo-css.png" alt="Css">
            <h3> description  </h3>
        </header>
        <section>
            <h2 class="subtitle">Runner:</h2>
            <div id="runner" class="sp1"></div>
            <h2 class="subtitle">Dino:</h2>
            <div id="dino" class="sp1"></div>
        </section>
        </menu>
    </main>
    <script>
        const runner        = document.getElementById('runner');
        const runnerSprides = 6;
        let runnerCount     = 1;
        setInterval(() => {
            if(runnerCount == runnerSprides) {
                runner.className = '';
                runnerCount = 1;
            } else {
                runner.className = '';
                runner.classList.add('sp'+ ++runnerCount);
            }
            
        }, 80);

        const dino        = document.getElementById('dino');
        const dinoSprides = 2;
        let dinoCount     = 1;
        setInterval(() => {
            if(dinoCount == dinoSprides) {
                dino.className = '';
                dino.classList = 1;
            } else {
                dino.className = '';
                dino.classList.add('sp'+ ++dinoCount);
            }  
        }, 80);

    </script>
    
</body>
</html>
